<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>JellyTag</title>
</head>
<body>
    <div id="JellyTagConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <style>
            .jellytag-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1em; }
            .jellytag-section { border: 1px solid rgba(255,255,255,.12); border-radius: .4em; margin: 1em 0; overflow: hidden; }
            .jellytag-section > summary { display: flex; align-items: center; gap: .6em; padding: .75em 1.2em; margin: 0; background: #00a4dc; color: #fff; cursor: pointer; font-size: 1.15em; font-weight: 600; letter-spacing: .02em; list-style: none; user-select: none; }
            .jellytag-section > summary::-webkit-details-marker { display: none; }
            .jellytag-section > summary::before { content: '\25B6'; font-size: .65em; transition: transform .2s ease; }
            .jellytag-section[open] > summary::before { transform: rotate(90deg); }
            .jellytag-section-body { padding: .8em 1.2em 1.2em; }
            .jellytag-sub { border: 1px solid rgba(255,255,255,.1); border-radius: .3em; margin: 1em 0 .5em; overflow: hidden; }
            .jellytag-sub > summary { display: flex; align-items: center; gap: .5em; padding: .55em 1em; background: rgba(255,255,255,.06); cursor: pointer; font-weight: 500; list-style: none; user-select: none; }
            .jellytag-sub > summary::-webkit-details-marker { display: none; }
            .jellytag-sub > summary::before { content: '\25B6'; font-size: .55em; transition: transform .2s ease; }
            .jellytag-sub[open] > summary::before { transform: rotate(90deg); }
            .jellytag-sub-body { padding: .5em 1em 1em; }
            .jellytag-sub > summary { position: relative; padding-right: 4.5em; }
            .panel-arrows { position: absolute; right: .6em; top: 50%; transform: translateY(-50%); display: flex; gap: .25em; }
            .panel-arrows button { background: rgba(255,255,255,.15); border: none; color: #fff; width: 26px; height: 26px; border-radius: .2em; cursor: pointer; font-size: .85em; line-height: 26px; text-align: center; padding: 0; }
            .panel-arrows button:hover { background: rgba(0,164,220,.6); }
            .panel-arrows button:disabled { opacity: .3; cursor: default; }
            .hidden { display: none !important; }
            .jellytag-invalid { outline: 2px solid #e57373 !important; outline-offset: -2px; }
            .jellytag-field-error { color: #e57373; font-size: .85em; margin-top: .3em; }
            .checkboxContainer:has(input:disabled) .emby-checkbox-label { opacity: .45; }
            .jellytag-text-box { padding: .6em; border: 1px solid rgba(255,255,255,.08); border-radius: .3em; margin-top: .5em; }
            .jellytag-rgba { display: flex; gap: .5em; align-items: center; }
            .jellytag-rgba input[type="number"] { width: 80px; }
            .badge-card { display: flex; flex-direction: column; align-items: center; border: 1px solid rgba(255,255,255,.15); border-radius: .4em; padding: .6em; cursor: pointer; transition: border-color .2s; position: relative; }
            .badge-card:hover { border-color: #00a4dc; }
            .badge-card.custom { border-color: #4caf50; }
            .badge-card img { width: 80px; height: 80px; object-fit: contain; }
            .badge-card .badge-label { margin-top: .4em; font-size: .85em; text-align: center; }
            .badge-card .badge-reset { position: absolute; top: 4px; right: 4px; background: #c62828; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 20px; text-align: center; cursor: pointer; display: none; padding: 0; }
            .badge-card.custom .badge-reset { display: block; }
            .jellytag-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1em; }
            .jellytag-row.three { grid-template-columns: 1fr 1fr 1fr; }
            .jellytag-custom-images { display: flex; flex-wrap: wrap; gap: 8px; margin: .6em 0; }
            .jellytag-custom-images > .badge-cards { display: contents; }
            .badge-cards { display: flex; flex-wrap: wrap; gap: 8px; }
            .lang-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -.5em 0 1em; }
            .lang-chip { display: inline-flex; align-items: center; gap: .4em; padding: .2em .4em .2em .7em; border-radius: 1em; background: rgba(0,164,220,.25); font-size: .9em; }
            .lang-chip button { background: none; border: none; color: inherit; cursor: pointer; font-size: 1.1em; line-height: 1; padding: 0 .2em; }
            .badge-cards .badge-card { padding: .3em .4em; }
            .badge-cards .badge-card img { width: 72px; height: 36px; }
            .jellytag-config-layout { display: block; margin-right: 350px; }
            .jellytag-config-layout > form { min-width: 0; }
            .jellytag-preview-panel { position: fixed; top: 4.5em; width: 322px; max-height: calc(100vh - 5.5em); overflow-y: auto; border: 1px solid rgba(255,255,255,.12); border-radius: .4em; background: rgba(20,20,20,.95); padding: 1em; z-index: 50; }
            .jellytag-preview-panel h3 { margin: 0 0 .8em; font-size: 1.1em; }
            .jellytag-preview-panel .preview-search-wrap { position: relative; margin-bottom: 1em; }
            .jellytag-preview-panel .preview-search-wrap input { width: 100%; box-sizing: border-box; }
            .jellytag-preview-panel .preview-search-results { position: absolute; top: 100%; left: 0; right: 0; z-index: 100; background: #1c1c1e; border: 1px solid rgba(255,255,255,.2); border-radius: .3em; max-height: 250px; overflow-y: auto; display: none; }
            .jellytag-preview-panel .preview-search-results .preview-search-item { padding: .5em .8em; cursor: pointer; font-size: .9em; }
            .jellytag-preview-panel .preview-search-results .preview-search-item:hover { background: rgba(0,164,220,.3); }
            .jellytag-preview-panel .preview-selected { font-size: .85em; color: #aaa; margin-bottom: .8em; }
            .jellytag-preview-panel .preview-img { width: 100%; max-width: 300px; border-radius: .3em; margin-bottom: .8em; }
            .jellytag-preview-panel .preview-img.poster { aspect-ratio: 2/3; object-fit: cover; max-height: 440px; }
            .jellytag-preview-panel .preview-img.thumb { aspect-ratio: 16/9; object-fit: cover; }
            .jellytag-preview-panel .preview-img.logo { object-fit: contain; background: repeating-conic-gradient(#555 0% 25%, #333 0% 50%) 50% / 16px 16px; }
            .jellytag-preview-panel .preview-spinner { display: none; text-align: center; color: #aaa; padding: .5em 0; font-size: .9em; }
            .jellytag-preview-panel .preview-error { display: none; color: #e57373; font-size: .85em; margin-top: .5em; }
            @media (max-width: 1000px) {
                .jellytag-config-layout { margin-right: 0; }
                .jellytag-preview-panel { position: static; width: 100%; max-width: 100%; max-height: none; margin-bottom: 1em; }
            }
            .jellytag-tabs { display: flex; flex-wrap: wrap; gap: .3em; border-bottom: 1px solid rgba(255,255,255,.15); margin-bottom: 1em; }
            .jellytag-tabs button { background: none; border: none; border-bottom: 2px solid transparent; color: inherit; padding: .6em 1em; cursor: pointer; font-size: 1em; }
            .jellytag-tabs button.active { border-bottom-color: #00a4dc; color: #00a4dc; }
            .jellytag-toolbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: .6em; }
            .jellytag-toolbar .inputContainer { flex: 1 1 14em; margin-bottom: 0; }
            .jellytag-libs { width: 100%; border-collapse: collapse; }
            .jellytag-libs td { padding: .3em .5em; vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,.06); }
            .jellytag-libs td.lib-name { width: 40%; }
            .jellytag-libs select { width: 100%; }
            .jellytag-arrows { display: inline-flex; gap: .25em; }
            .jellytag-arrows button { background: rgba(255,255,255,.15); border: none; color: #fff; width: 26px; height: 26px; border-radius: .2em; cursor: pointer; font-size: .85em; padding: 0; }
            .jellytag-arrows button:hover { background: rgba(0,164,220,.6); }
            .jellytag-arrows button:disabled { opacity: .3; cursor: default; }
            .jellytag-savebar { position: sticky; bottom: 0; z-index: 40; display: flex; align-items: center; gap: 1em; margin-top: 1em; padding: .6em 1em; background: rgba(20,20,20,.97); border-top: 1px solid rgba(255,255,255,.12); }
            .jellytag-savebar #DirtyState { flex: 1; color: #aaa; }
            .jellytag-savebar.dirty #DirtyState { color: #ffb74d; }
            .jellytag-savebar button { margin: 0; }
            .jellytag-zone-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5em; margin: 1em 0; }
            .zone-cell { display: flex; flex-direction: column; gap: .4em; min-height: 6em; padding: .5em; border: 1px solid rgba(255,255,255,.15); border-radius: .3em; }
            .zone-cell.empty { border-color: transparent; }
            .jellytag-zone-grid.dragging .zone-cell { background: rgba(255,255,255,.03); }
            .jellytag-zone-grid.dragging .zone-cell.empty { border: 1px dashed rgba(255,255,255,.3); }
            .zone-direction { margin-left: .4em; }
            .zone-newline { display: none; padding: .15em; border: 1px dashed rgba(255,255,255,.3); border-radius: 1em; color: #aaa; font-size: .75em; text-align: center; }
            .jellytag-zone-grid.dragging .zone-newline { display: block; }
            .zone-newline.over { background: rgba(0,164,220,.25); border-color: #00a4dc; color: #fff; }
            .zone-head { display: flex; align-items: center; gap: .3em; min-height: 26px; font-size: .85em; color: #aaa; }
            .zone-title { flex: 1; }
            .zone-gear:disabled { opacity: .3; cursor: default; }
            .zone-actions button { width: 22px; height: 22px; font-size: .75em; }
            .zone-actions .zone-remove { font-size: 1.1em; line-height: 1; }
            .zone-actions .zone-remove:hover { background: #c62828; }
            .zone-controls { display: flex; gap: .3em; margin-top: auto; }
            .zone-controls .zone-add { flex: 1; min-width: 0; margin-top: 0; }
            .zone-gear { background: none; border: none; color: inherit; cursor: pointer; font-size: 1.2em; padding: 0 .2em; }
            .zone-gear.active, .zone-gear:not(:disabled):hover { color: #00a4dc; }
            .zone-lines { display: flex; gap: .3em; }
            .zone-lines.rows { flex-direction: column; }
            .zone-lines.columns { flex-direction: row; align-items: flex-start; }
            .zone-line { display: flex; flex-wrap: wrap; gap: .3em; }
            .zone-lines.columns .zone-line { flex-direction: column; }
            .panel-chip { min-width: 4.2em; box-sizing: border-box; background: rgba(0,164,220,.25); border: 1px solid transparent; border-radius: 1em; cursor: grab; font-size: .85em; padding: .2em .7em; text-align: center; user-select: none; }
            .panel-chip.dragged { opacity: .4; }
            .panel-chip.insert-before { box-shadow: -3px 0 0 #00a4dc; }
            .panel-chip.insert-after { box-shadow: 3px 0 0 #00a4dc; }
            .zone-lines.columns .panel-chip.insert-before { box-shadow: 0 -3px 0 #00a4dc; }
            .zone-lines.columns .panel-chip.insert-after { box-shadow: 0 3px 0 #00a4dc; }
            .panel-chip.selected { background: rgba(0,164,220,.55); border-color: #00a4dc; }
            .zone-add { margin-top: auto; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-radius: .3em; color: inherit; font-size: .85em; padding: .25em; }
            .zone-add option { background: #1c1c1e; }
            .jellytag-editor { border: 1px solid rgba(255,255,255,.12); border-radius: .4em; padding: .8em 1em; }
            .jellytag-editor h4 { margin: 0 0 .6em; }
            .jellytag-editor h4.jellytag-custom-title { margin: 1.2em 0 .3em; font-size: 1em; }
            .badge-missing { display: flex; align-items: center; justify-content: center; width: 72px; height: 36px; color: #aaa; font-size: .7em; text-align: center; }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <div class="jellytag-config-layout">
                <form id="JellyTagConfigForm">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">JellyTag Configuration</h2>
                    </div>
                    <div class="verticalSection">
                        <h3 class="sectionTitle">General</h3>
                        <div class="checkboxContainer checkboxContainer-withDescription">
                            <label class="emby-checkbox-label">
                                <input id="Enabled" type="checkbox" is="emby-checkbox" data-global="Enabled" />
                                <span>Enable JellyTag</span>
                            </label>
                        </div>
                    </div>

                    <details class="jellytag-section" open>
                        <summary>Profiles</summary>
                        <div class="jellytag-section-body" id="ProfileSection"><em>Loading...</em></div>
                    </details>

                    <details class="jellytag-section">
                        <summary>Libraries</summary>
                        <div class="jellytag-section-body">
                            <div class="fieldDescription">An item in several libraries uses the first of them in this list.</div>
                            <div id="LibraryTable"><em>Loading libraries...</em></div>
                        </div>
                    </details>

                    <details class="jellytag-section" open>
                        <summary id="ImagesTitle">Images</summary>
                        <div class="jellytag-section-body">
                            <div id="ImageTabs" class="jellytag-tabs"></div>
                            <div id="ImageTab"></div>
                        </div>
                    </details>

                    <details class="jellytag-section">
                        <summary>Performance</summary>
                        <div class="jellytag-section-body">
                            <div class="inputContainer">
                                <label class="inputLabel inputLabelUnfocused" for="CacheDurationHours">Cache Duration (hours)</label>
                                <input id="CacheDurationHours" type="number" min="1" max="720" step="1" is="emby-input" data-global="CacheDurationHours" />
                            </div>
                            <div class="inputContainer">
                                <label class="inputLabel inputLabelUnfocused" for="OutputFormat">Output Format</label>
                                <select id="OutputFormat" is="emby-select" data-global="OutputFormat">
                                    <option value="Jpeg">JPEG</option>
                                    <option value="WebP">WebP (experimental)</option>
                                </select>
                            </div>
                            <div id="JpegQualityContainer" class="inputContainer">
                                <label class="inputLabel inputLabelUnfocused" for="JpegQuality">JPEG Quality</label>
                                <input id="JpegQuality" type="number" min="1" max="100" step="1" is="emby-input" data-global="JpegQuality" />
                            </div>
                            <div id="WebPQualityContainer" class="inputContainer" style="display:none;">
                                <label class="inputLabel inputLabelUnfocused" for="WebPQuality">WebP Quality</label>
                                <input id="WebPQuality" type="number" min="1" max="100" step="1" is="emby-input" data-global="WebPQuality" />
                            </div>
                            <div id="CacheStatsInfo" class="fieldDescription" style="margin-top:.5em;"></div>
                        </div>
                    </details>

                    <div class="verticalSection" style="margin-top:1em;">
                        <button id="ClearCache" type="button" is="emby-button" class="raised button-warning block" style="width:100%;"><span>Clear Image Cache</span></button>
                        <button id="ExportConfig" type="button" is="emby-button" class="raised block" style="width:100%; margin-top:.5em;"><span>Export Config</span></button>
                        <button id="ImportConfigBtn" type="button" is="emby-button" class="raised block" style="width:100%; margin-top:.5em;"><span>Import Config</span></button>
                        <input id="ImportConfigFile" type="file" accept="application/json,.json" style="display:none;" />
                        <input id="CustomBadgeFile" type="file" accept="image/svg+xml,image/png,image/jpeg" style="display:none;" />
                        <button id="ResetAllSettings" type="button" is="emby-button" class="raised block" style="background:#888; width:100%; margin-top:.5em;"><span>Reset All Settings to Default</span></button>
                    </div>

                    <div id="SaveError" class="jellytag-field-error hidden" style="margin-top:1em;"></div>
                    <div id="SaveBar" class="jellytag-savebar">
                        <span id="DirtyState"></span>
                        <button is="emby-button" type="submit" class="raised button-submit"><span>Save</span></button>
                    </div>
                </form>
                <div class="jellytag-preview-panel">
                    <h3>Live Preview</h3>
                    <div class="preview-search-wrap">
                        <input id="PreviewSearch" type="text" is="emby-input" placeholder="Search for a movie, series or episode..." />
                        <div id="PreviewSearchResults" class="preview-search-results"></div>
                    </div>
                    <div id="PreviewSelected" class="preview-selected"></div>
                    <div id="PreviewSpinner" class="preview-spinner">Refreshing preview...</div>
                    <img id="PreviewImage" class="preview-img" alt="Preview" style="display:none;" />
                    <div id="PreviewError" class="preview-error"></div>
                    <div class="fieldDescription">Shows the active tab with the settings being edited, before they are saved.</div>
                </div>
                </div>
            </div>
        </div>

        <script type="text/javascript">
        var JellyTagConfig = { pluginUniqueId: 'f4a2e8c1-9b3d-4f7a-b6c5-2d8e1a3f9b04' };

        // ===== Panel definitions =====
        var PANEL_DEFS = {
            Res: {
                title: 'Resolution Badges',
                badges: [{id:'4K',key:'4k',label:'4K / UHD'},{id:'1080p',key:'1080p',label:'1080p'},{id:'720p',key:'720p',label:'720p'},{id:'SD',key:'sd',label:'SD'}],
                hasShowMode: true,
                showModeOptions: [{v:'Highest',l:'Highest only'},{v:'All',l:'All'}]
            },
            Hdr: {
                title: 'HDR / 3D Badges',
                badges: [{id:'Hdr10',key:'hdr10',label:'HDR10'},{id:'Hdr10Plus',key:'hdr10plus',label:'HDR10+'},{id:'DV',key:'dv',label:'Dolby Vision'},{id:'HLG',key:'hlg',label:'HLG'},{id:'GenericHdr',key:'hdr',label:'Other HDR (unknown type)'},{id:'3D',key:'3d',label:'3D'},{id:'DvProfile',key:'dvprofile',label:'Dolby Vision profile (DV P8.1...)'}],
                hasShowMode: true,
                showModeOptions: [{v:'Highest',l:'Highest only'},{v:'All',l:'All'}]
            },
            Codec: {
                title: 'Codec Badges',
                badges: [{id:'H264',key:'h264',label:'H.264 / AVC'},{id:'HEVC',key:'hevc',label:'HEVC / H.265'},{id:'AV1',key:'av1',label:'AV1'},{id:'VP9',key:'vp9',label:'VP9'}],
                hasShowMode: false
            },
            Audio: {
                title: 'Audio Badges',
                badges: [{id:'Atmos',key:'atmos',label:'Dolby Atmos'},{id:'DtsX',key:'dtsx',label:'DTS:X'},{id:'TrueHD',key:'truehd',label:'Dolby TrueHD'},{id:'DtsHdMa',key:'dtshdma',label:'DTS-HD MA'},{id:'Channel',key:'channel',label:'Channel Layout (7.1/5.1/Stereo)'}],
                hasShowMode: true,
                showModeOptions: [{v:'Highest',l:'Highest only'},{v:'All',l:'All'}]
            },
            Runtime: {
                title: 'Video Length',
                badges: [{id:'Runtime',key:'runtime',label:'Video length'}],
                hasShowMode: false,
                // A single badge, enabled with the panel, and only drawn as text.
                single: true,
                textOnly: true
            },
            Rating: {
                title: 'Rating',
                badges: [{id:'Community',key:'rating',label:'TMDB / IMDb rating'},{id:'Critic',key:'critic',label:'Rotten Tomatoes critics)'}],
                hasShowMode: false,
                fixedShowMode: 'All',
                textOnly: true,
                // Text badges drawn after an icon, which the image gallery can replace.
                iconImages: true
            }
        };

        // ===== Custom images and texts (shared by posters and thumbnails) =====
        var DV_PROFILES = ['5', '7', '8.1', '8.2', '8.4', '10.0', '10.1', '10.2', '10.4'];
        var KEY_LABELS = {
            '4k':'4K', '1080p':'1080p', '720p':'720p', 'sd':'SD',
            'hdr10':'HDR10', 'hdr10plus':'HDR10+', 'dv':'Dolby Vision', 'hlg':'HLG', 'hdr':'Other HDR', '3d':'3D',
            'h264':'H.264', 'hevc':'HEVC', 'av1':'AV1', 'vp9':'VP9',
            'atmos':'Atmos', 'dtsx':'DTS:X', 'truehd':'TrueHD', 'dtshdma':'DTS-HD MA',
            '7.1':'7.1', '5.1':'5.1', 'stereo':'Stereo'
        };
        DV_PROFILES.forEach(function(p) { KEY_LABELS['dvp' + p] = 'DV P' + p; });
        // Text drawn when the panel style is Text and no custom text is set.
        var DEFAULT_TEXTS = {
            '4k':'4K', '1080p':'1080p', '720p':'720p', 'sd':'SD',
            'hdr10':'HDR10', 'hdr10plus':'HDR10+', 'dv':'DV', 'hlg':'HLG', 'hdr':'HDR', '3d':'3D',
            'h264':'H.264', 'hevc':'HEVC', 'av1':'AV1', 'vp9':'VP9',
            'atmos':'ATMOS', 'dtsx':'DTS:X', 'truehd':'TrueHD', 'dtshdma':'DTS-HD MA',
            '7.1':'7.1', '5.1':'5.1', 'stereo':'STEREO'
        };

        // Badge keys behind a panel checkbox, with a custom image and/or a custom text.
        function customKeysOf(b) {
            if (b.key === 'channel') return { images: ['7.1', '5.1', 'stereo'], texts: ['7.1', '5.1', 'stereo'] };
            if (b.key === 'dvprofile') return { images: DV_PROFILES.map(function(p) { return 'dvp' + p; }), texts: [] };
            // Texts computed per item: nothing to replace.
            if (b.key === 'runtime') return { images: [], texts: [] };
            if (b.key === 'rating' || b.key === 'critic') return { images: [b.key], texts: [] };
            return { images: [b.key], texts: [b.key] };
        }

        // ===== Language picker: names from Jellyfin's own list, codes stored =====
        var cultures = [];          // [{name, codes:[...]}] sorted by name, from /Localization/Cultures

        function loadCultures() {
            var token = ApiClient.accessToken();
            var headers = {}; if (token) headers['Authorization'] = 'MediaBrowser Token="' + token + '"';
            return fetch(ApiClient.getUrl('Localization/Cultures'), {headers:headers}).then(function(r){return r.json();}).then(function(list) {
                cultures = list
                    .filter(function(c) { return c.ThreeLetterISOLanguageName; })
                    .map(function(c) { return { name: c.DisplayName, code: c.ThreeLetterISOLanguageName, codes: c.ThreeLetterISOLanguageNames || [c.ThreeLetterISOLanguageName] }; })
                    .sort(function(a, b) { return a.name.localeCompare(b.name); });
            }).catch(function(err) { console.error('[JellyTag] Failed to load languages:', err); });
        }

        function cultureOf(code) {
            for (var i = 0; i < cultures.length; i++) {
                if (cultures[i].codes.indexOf(code) >= 0) return cultures[i];
            }
            return null;
        }

        // ===== Utility =====
        function toggleOutputQuality() {
            var fmt = q('OutputFormat').value;
            document.querySelector('#JpegQualityContainer').style.display = fmt === 'Jpeg' ? '' : 'none';
            document.querySelector('#WebPQualityContainer').style.display = fmt === 'WebP' ? '' : 'none';
        }

        // ===== Badge images =====
        // Same rule as the server: flags keep their key, other badges get a prefix (5.1 -> badge-5_1).
        function badgeFileStem(key) {
            return key.indexOf('flag-') === 0 ? key : 'badge-' + key.replace('.', '_');
        }

        function addBadgeCard(container, b, customList, token) {
            var isCustom = customList.indexOf(badgeFileStem(b.key)) >= 0;
            var card = document.createElement('div'); card.className = 'badge-card' + (isCustom ? ' custom' : '');
            card.setAttribute('data-badge-key', b.key);
            var img = document.createElement('img');
            var previewUrl = ApiClient.getUrl('JellyTag/BadgePreview/' + b.key);

            else if (action === 'lang-remove' || action === 'reset-colors') onPanelSettingClick(action, target);
            else if (action === 'move-inline') moveInLine(target.getAttribute('data-type'), parseInt(target.getAttribute('data-delta'), 10));
            else if (action === 'move-across') moveAcross(target.getAttribute('data-type'), parseInt(target.getAttribute('data-delta'), 10));
            else if (action === 'remove-panel') removePanel(target.getAttribute('data-type'));
        });

        configForm.addEventListener('change', function(e) {
            var field = e.target, p = currentProfile();
            if (field.id === 'ProfileSelect') { state.profileId = field.value; state.editing = null; renderAll(); schedulePreview(); return; }
            if (field.hasAttribute('data-add-position')) { if (field.value) addPanel(field.getAttribute('data-add-position'), field.value); return; }
            if (field.hasAttribute('data-move-to')) { if (field.value) movePanelTo(field.getAttribute('data-move-to'), field.value); return; }

            // An out-of-range number stays out of the settings: Save then reports it (see below).
            if (field.type === 'number' && !field.validity.valid) return;
            if (onPanelSettingChange(field)) return;
            var global = field.getAttribute('data-global');
            if (global) {
                state.config[global] = field.type === 'checkbox' ? field.checked : field.type === 'number' ? parseInt(field.value, 10) : field.value;
                if (global === 'OutputFormat') toggleOutputQuality();
            } else if (field.id === 'ShowOnEpisodes') {
                p.ShowOnEpisodes = field.checked;
            } else if (field.hasAttribute('data-lib-index')) {
                state.config.LibraryAssignments[parseInt(field.getAttribute('data-lib-index'), 10)].ProfileId = field.value || null;
            } else if (field.id === 'ImageEnabled') {
                imageOf(p, state.tab).Enabled = field.checked;
            } else if (field.id === 'ImageMode') {
                imageOf(p, state.tab).SameAs = field.value || null;
                renderImageTab();
            } else if (field.id === 'ImageSizeReduction') {
                imageOf(p, state.tab).SizeReduction = parseInt(field.value, 10);
            } else if (ZONE_FIELDS[field.id] && state.editing && state.editing.kind === 'zone') {
                var zone = zoneAt(currentImage(), state.editing.position);
                zone[ZONE_FIELDS[field.id]] = field.id === 'ZoneArrangement' ? field.value : parseFloat(field.value);
                if (field.id === 'ZoneArrangement') renderImageTab();
            } else {
                return;
            }
            markDirty();
        });

        // ===== Drag and drop =====
        var dragged = null, dropHint = null;
        function clearDropHint() {
            if (dropHint) dropHint.classList.remove('over', 'insert-before', 'insert-after');
            dropHint = null;
        }
        // The drop target under the pointer and, for a chip, which side of it.
        function dropTargetOf(e) {
            var strip = e.target.closest('.zone-newline');
            if (strip) return { node: strip, target: { position: strip.getAttribute('data-drop-position') } };
            var chip = e.target.closest('.panel-chip');
            if (!chip || chip.getAttribute('data-type') === dragged) return null;
            var rect = chip.getBoundingClientRect();
            var vertical = !!chip.closest('.zone-lines.columns');
            var after = vertical ? e.clientY > rect.top + rect.height / 2 : e.clientX > rect.left + rect.width / 2;
            return { node: chip, target: { anchor: chip.getAttribute('data-type'), after: after } };
        }
        configForm.addEventListener('dragstart', function(e) {
            var chip = e.target.closest && e.target.closest('.panel-chip');
            if (!chip) return;
            dragged = chip.getAttribute('data-type');
            // Firefox starts a drag only when some data is set.
            e.dataTransfer.setData('text/plain', dragged);
            e.dataTransfer.effectAllowed = 'move';
            chip.classList.add('dragged');
            chip.closest('.jellytag-zone-grid').classList.add('dragging');
        });
        configForm.addEventListener('dragover', function(e) {
            if (!dragged) return;
            var hit = dropTargetOf(e);
            clearDropHint();
            if (!hit) return;
            e.preventDefault();
            dropHint = hit.node;
            dropHint.classList.add(hit.target.anchor ? (hit.target.after ? 'insert-after' : 'insert-before') : 'over');
        });
        configForm.addEventListener('drop', function(e) {
            if (!dragged) return;
            var hit = dropTargetOf(e);
            e.preventDefault();
            var type = dragged;
            dragged = null;
            clearDropHint();
            if (hit) dropPanel(type, hit.target); else renderImageTab();
        });
        configForm.addEventListener('dragend', function() {
            if (!dragged) return;
            dragged = null;
            clearDropHint();
            renderImageTab();
        });
        // The chips are divs: Enter and Space open them like a button.
        configForm.addEventListener('keydown', function(e) {
            if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('panel-chip')) { e.preventDefault(); e.target.click(); }
        });

        configForm.addEventListener('submit', function(e) {
            e.preventDefault();
            saveError.classList.add('hidden');
            Dashboard.showLoadingMsg();
            ApiClient.updatePluginConfiguration(JellyTagConfig.pluginUniqueId, state.config).then(function(result) {
                Dashboard.processPluginConfigurationUpdateResult(result);
                // The server repairs and converts what it saves: show what it kept.
                return ApiClient.getPluginConfiguration(JellyTagConfig.pluginUniqueId);
            }).then(function(config) {
                state.config = config;
                state.dirty = false;
                syncLibraryRows();
                renderAll();
            }).catch(function(err) {
                Dashboard.hideLoadingMsg();
                saveError.textContent = 'Not saved: ' + (err && err.message ? err.message : err);
                saveError.classList.remove('hidden');
            });
            return false;
        });

        // The dashboard is a single-page app: this only covers closing or reloading the tab.
        window.addEventListener('beforeunload', function(e) {
            if (state.dirty && document.querySelector('#JellyTagConfigPage')) { e.preventDefault(); e.returnValue = ''; }
        });

        // ===== Page Show =====
        document.querySelector('#JellyTagConfigPage').addEventListener('pageshow', function() {
            Dashboard.showLoadingMsg();
            Promise.all([
                ApiClient.getPluginConfiguration(JellyTagConfig.pluginUniqueId),
                getJson('Library/VirtualFolders'),
                getJson('JellyTag/PanelDefaults')
            ]).then(function(res) {
                state.config = res[0];
                state.libraries = res[1].map(function(f) { return { Id: f.ItemId, Name: f.Name }; });
                state.defaults = res[2];
                state.profileId = DEFAULT_PROFILE_ID;
                state.dirty = false;
                syncLibraryRows();
                renderAll();
                Dashboard.hideLoadingMsg();
            }).catch(function(err) {
                console.error('[JellyTag] Failed to load the settings:', err);
                Dashboard.hideLoadingMsg();
                Dashboard.alert('Failed to load JellyTag configuration.');
            });

            loadBadgeGallery();
            loadCultures();
            loadCacheStats();

            // The preview panel is fixed to the right of the form on wide screens.
            var panel = document.querySelector('.jellytag-preview-panel');
            function positionPanel() {
                if (window.innerWidth <= 1000) { panel.style.left = ''; return; }
                panel.style.left = (configForm.getBoundingClientRect().right + 16) + 'px';
            }
            positionPanel();
            window.addEventListener('resize', positionPanel);
        });

        // ===== Field Validation =====
        // Own English hints instead of the browser's validationMessage, which follows the
        // browser language rather than the page's.
        function constraintHint(field) {
            if (field.validity.badInput) return 'Enter a number';
            var parts = [];
            if (field.min !== '' && field.max !== '') parts.push(field.min + '–' + field.max);
            if (field.step === '1') parts.push('whole number');
            else if (field.step && field.step !== 'any') parts.push('step ' + field.step);
            return parts.join(', ') || 'Invalid value';
        }
        function markField(field) {
            var err = document.getElementById(field.id + 'Error');
            if (field.validity.valid) {
                field.classList.remove('jellytag-invalid');
                if (err) err.remove();
                return;
            }
            field.classList.add('jellytag-invalid');
            if (!err) {
                err = document.createElement('div');
                err.id = field.id + 'Error';
                err.className = 'jellytag-field-error';
                field.insertAdjacentElement('afterend', err);
            }
            err.textContent = constraintHint(field);
        }
        function fieldPath(field) {
            var section = field.closest('.jellytag-section');
            var panel = field.closest('details[data-panel-id]');
            var label = document.querySelector('label[for="' + field.id + '"]');
            return [section && section.querySelector('summary').textContent,
                panel && panel.querySelector('summary').firstChild.textContent,
                label ? label.textContent : field.id].filter(Boolean).join(' › ');
        }
        configForm.addEventListener('input', function(e) {
            if (e.target.type !== 'number') return;
            markField(e.target);
            if (!configForm.querySelector('.jellytag-invalid')) saveError.classList.add('hidden');
        });
        // The browser fires 'invalid' once per bad field, then cancels the submit; its own bubble
        // only works on a visible field, so inside a collapsed section Save did nothing (#27).
        // 'invalid' does not bubble: listen in the capture phase.
        var invalidBurst = null;
        configForm.addEventListener('invalid', function(e) {
            e.preventDefault();
            var field = e.target;
            markField(field);
            for (var d = field.closest('details'); d; d = d.parentElement.closest('details')) d.open = true;
            if (!invalidBurst) {
                invalidBurst = { first: null, hidden: [] };
                setTimeout(reportInvalidBurst, 0);
            }
            if (!field.offsetParent) invalidBurst.hidden.push(fieldPath(field));
            else if (!invalidBurst.first) invalidBurst.first = field;
        }, true);
        function reportInvalidBurst() {
            var burst = invalidBurst;
            invalidBurst = null;
            if (burst.first) { burst.first.scrollIntoView({ block: 'center' }); burst.first.focus(); }
            var msg = 'Not saved: fix the settings highlighted in red.';
            if (burst.hidden.length) msg += ' Out of range but hidden by another option: ' + burst.hidden.join('; ') + '.';
            saveError.textContent = msg;
            saveError.classList.remove('hidden');
        }

        // ===== Other Handlers =====
        document.querySelector('#ClearCache').addEventListener('click', function() {
            if (confirm('Are you sure you want to clear the image cache?')) {
                Dashboard.showLoadingMsg();
                ApiClient.ajax({type:'POST',url:ApiClient.getUrl('JellyTag/ClearCache')}).then(function(){
                    Dashboard.hideLoadingMsg(); Dashboard.alert('Cache cleared successfully.'); loadCacheStats();
                }).catch(function(){Dashboard.hideLoadingMsg();Dashboard.alert('Failed to clear cache.');});
            }
        });

        document.querySelector('#CustomBadgeFile').addEventListener('change', function() {
            var fi = this; var bk = fi.getAttribute('data-target-key');
            if (!bk || !fi.files || fi.files.length === 0) return;
            var fd = new FormData(); fd.append('file', fi.files[0]);
            Dashboard.showLoadingMsg();
            var xhr = new XMLHttpRequest();
            xhr.open('POST', ApiClient.getUrl('JellyTag/CustomBadge/' + bk), true);
            var token = ApiClient.accessToken();
            if (token) xhr.setRequestHeader('Authorization', 'MediaBrowser Token="' + token + '"');
            xhr.onload = function(){Dashboard.hideLoadingMsg();fi.value='';if(xhr.status===204){Dashboard.alert('Badge uploaded.');loadBadgeGallery();refreshPreview();}else{Dashboard.alert('Upload failed.');}};
            xhr.onerror = function(){Dashboard.hideLoadingMsg();fi.value='';Dashboard.alert('Upload failed.');};
            xhr.send(fd);
        });

        document.querySelector('#ExportConfig').addEventListener('click', function() {
            window.location = ApiClient.getUrl('JellyTag/ExportConfig') + '?ApiKey=' + ApiClient.accessToken();
        });
        document.querySelector('#ImportConfigBtn').addEventListener('click', function() { document.querySelector('#ImportConfigFile').click(); });
        document.querySelector('#ImportConfigFile').addEventListener('change', function() {
            var fi = this; var file = fi.files[0]; if (!file) return;
            if (confirm('Import this configuration? Current settings will be overwritten.')) {
                Dashboard.showLoadingMsg(); var fd = new FormData(); fd.append('file', file);
                fetch(ApiClient.getUrl('JellyTag/ImportConfig'), {method:'POST',headers:{'Authorization':'MediaBrowser Token="'+ApiClient.accessToken()+'"'},body:fd}).then(function(r){
                    Dashboard.hideLoadingMsg();fi.value='';if(r.ok){Dashboard.alert('Configuration imported. Reloading...');window.location.reload();}else{r.text().then(function(t){Dashboard.alert('Import failed: '+t);});}
                }).catch(function(){Dashboard.hideLoadingMsg();fi.value='';Dashboard.alert('Failed to import configuration.');});
            } else { fi.value=''; }
        });
        document.querySelector('#ResetAllSettings').addEventListener('click', function() {
            if (confirm('Reset ALL settings to their default values? This cannot be undone.')) {
                Dashboard.showLoadingMsg();
                ApiClient.ajax({type:'POST',url:ApiClient.getUrl('JellyTag/ResetConfig')}).then(function(){
                    Dashboard.hideLoadingMsg();Dashboard.alert('Settings reset. Reloading...');window.location.reload();
                }).catch(function(){Dashboard.hideLoadingMsg();Dashboard.alert('Failed to reset settings.');});
            }
        });

        var outputFmtEl = document.querySelector('#OutputFormat');
        outputFmtEl.addEventListener('change', toggleOutputQuality);
        outputFmtEl.addEventListener('input', toggleOutputQuality);

        </script>
    </div>
</body>
</html>
