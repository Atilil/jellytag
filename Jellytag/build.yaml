# Plugin metadata, single source for meta.json and the manifest entry (`just package`).
# The version is not here: it comes from the release tag.
name: "JellyTag"
guid: "f4a2e8c1-9b3d-4f7a-b6c5-2d8e1a3f9b04"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "Atilili"
category: "General"
overview: "Overlays quality badges (resolution, HDR, codec, audio, language) on media posters and thumbnails"
# Folded (>): lines are joined, so the catalog shows real paragraphs.
description: >
  JellyTag automatically overlays quality badges on your media posters and
  thumbnails: resolution, HDR and Dolby Vision, video codec, audio, language
  flags and VOST indicator. Badges are rendered server-side and visible on all
  Jellyfin clients.


  Per-panel configuration, SVG and text badge styles, custom badge upload, live
  preview and library filtering.
artifacts:
  - "Jellyfin.Plugin.JellyTag.dll"
changelog: |
  - Badges cover every version of a movie (e.g. 1080p and 4K files).
  - Language flags: the default audio track comes first, the others alphabetically;
    15 new flags; flags can be replaced in the custom badge gallery.
  - Dolby Vision is shown with its HDR10/HDR10+/HLG base layer, Atmos with
    TrueHD, DTS:X with DTS-HD MA (set the HDR or audio panel to "All" to see both).
  - French VFQ/VFF audio detection and an optional video length badge.
  - Intro videos added by other plugins no longer get badges.
