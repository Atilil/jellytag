# git-cliff configuration: release notes generated from Conventional Commits.
# https://git-cliff.org/docs/configuration

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | upper_first }} \
({{ commit.id | truncate(length=7, end="") }})\
{% for footer in commit.footers %}{% if footer.token in ["Refs", "Fixes", "Closes"] %}, \
{{ footer.token | lower }}{{ footer.separator }}{{ footer.value }}{% endif %}{% endfor %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
# Old tags were prefixed with the plugin name, new ones are vX.Y.Z.
tag_pattern = "^(v|jellytag-)[0-9]"
# Pull requests merged with a non-conventional title: give them their type here.
commit_preprocessors = [
  { pattern = "^Keep JellyTag's data out of <config>/plugins", replace = "fix: Keep JellyTag's data out of <config>/plugins" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changes" },
  # build, ci, test, docs, chore: not user-facing.
  { message = ".*", skip = true },
]
